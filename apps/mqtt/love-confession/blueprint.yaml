# TC002 Fan Light Board
# Heartbeat, firework and shooting-star animations + custom scrolling text.

blueprint:
  name: TC002 Fan Light Board
  description: |
    Turns the TC002 into a confession gadget / concert fan light board.
    Supports heartbeat, firework and shooting-star animations, as well as custom scrolling text.

    Author: 王行知
    License: GPL-3.0-or-later
  domain: automation
  source_url: https://github.com/klein0r/Ulanzi-U-Clock-TC002/blob/docs/translate-to-english/apps/mqtt/love-confession/blueprint.yaml
  input:
    custom_app_topic:
      name: TC002 Custom App MQTT topic
      description: "Format: [PREFIX]/custom/[APP_NAME]"
      default: ulanzi_1bf6/custom/love_confession
      selector:
        text: {}
    display_duration:
      name: Display duration
      description: The payload duration value, in seconds.
      default: 31536000
      selector:
        number:
          min: 1
          max: 31536000
          unit_of_measurement: s
          mode: box

mode: restart

trigger:
  - platform: state
    entity_id: !input custom_app_topic

action:
  - service: mqtt.publish
    data:
      topic: !input custom_app_topic
      retain: true
      payload: >-
        {"duration": {{ display_duration | int }}, "text": [], "image": [{"data": "", "position": [0, 0]}], "draw": []}
