# TC002 Vocabulary Carousel
# Reads words from a CSV word list and shows them in a carousel on the TC002.

blueprint:
  name: TC002 Vocabulary Carousel
  description: |
    Turns the TC002 into a small desktop screen for learning vocabulary.
    Reads words from a CSV word list and shows them at random.

    Author: 王行知
    License: GPL-3.0-or-later
  domain: automation
  source_url: https://github.com/klein0r/Ulanzi-U-Clock-TC002/blob/docs/translate-to-english/apps/mqtt/vocabulary-widget/blueprint.yaml
  input:
    custom_app_topic:
      name: TC002 Custom App MQTT topic
      description: "Format: [PREFIX]/custom/[APP_NAME]"
      default: ulanzi_1bf6/custom/vocabulary
      selector:
        text: {}
    display_duration:
      name: Display duration
      description: The payload duration value, in seconds.
      default: 31536000
      selector:
        number:
          min: 1
          max: 31536000
          unit_of_measurement: s
          mode: box

mode: restart

trigger:
  - platform: state
    entity_id: !input custom_app_topic

action:
  - service: mqtt.publish
    data:
      topic: !input custom_app_topic
      retain: true
      payload: >-
        {"duration": {{ display_duration | int }}, "text": [], "image": [{"data": "", "position": [0, 0]}], "draw": []}
