# TC002 Git Contribution Heatmap
# Shows the GitHub contribution heatmap on the TC002.

blueprint:
  name: TC002 Git Contribution Heatmap
  description: |
    Shows the GitHub contribution heatmap on the TC002 as a 52-column × 7-row calendar dot matrix.
    Days with commits are shown in green at different brightness levels depending on the number of commits.

    Author: 王行知
    License: GPL-3.0-or-later
  domain: automation
  source_url: https://github.com/klein0r/Ulanzi-U-Clock-TC002/blob/docs/translate-to-english/apps/mqtt/git-contribution-heatmap/blueprint.yaml
  input:
    custom_app_topic:
      name: TC002 Custom App MQTT topic
      description: "Format: [PREFIX]/custom/[APP_NAME]"
      default: ulanzi_1bf6/custom/git_heatmap
      selector:
        text: {}
    display_duration:
      name: Display duration
      description: The payload duration value, in seconds.
      default: 31536000
      selector:
        number:
          min: 1
          max: 31536000
          unit_of_measurement: s
          mode: box
    update_hour:
      name: Update time (hour)
      description: The hour of the day at which the heatmap is updated (0-23)
      default: 9
      selector:
        number:
          min: 0
          max: 23
          unit_of_measurement: "h"
          mode: box

mode: restart

trigger:
  - platform: time
    at: !input update_hour

action:
  - service: mqtt.publish
    data:
      topic: !input custom_app_topic
      retain: true
      payload: >-
        {"duration": {{ display_duration | int }}, "text": [], "image": [{"data": "", "position": [0, 0]}], "draw": []}
