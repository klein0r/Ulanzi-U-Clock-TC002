# TC002 Year Progress Bar
# Shows this year's progress on the TC002 as a 52-column × 7-row calendar dot matrix.

blueprint:
  name: TC002 Year Progress Bar
  description: |
    Shows this year's progress on the TC002 as a 52-column × 7-row calendar dot matrix.
    Days already past are shown in dark green, today in a bright green breathing animation.
    The progress percentage is shown in the top right corner.

    Author: 王行知
    License: GPL-3.0-or-later
  domain: automation
  source_url: https://github.com/UlanziTechnology/Ulanzi-U-Clock-TC002/blob/main/apps/mqtt/year-progress-bar/blueprint.yaml
  input:
    custom_app_topic:
      name: TC002 Custom App MQTT topic
      description: "Format: [PREFIX]/custom/[APP_NAME]"
      default: ulanzi_1bf6/custom/year_progress
      selector:
        text: {}
    display_duration:
      name: Display duration
      description: The payload duration value, in seconds.
      default: 31536000
      selector:
        number:
          min: 1
          max: 31536000
          unit_of_measurement: s
          mode: box
    update_hour:
      name: Update time (hour)
      description: The hour of the day at which the progress bar is updated (0-23)
      default: 8
      selector:
        number:
          min: 0
          max: 23
          unit_of_measurement: "h"
          mode: box

mode: restart

trigger:
  - platform: time
    at: !input update_hour

action:
  - service: mqtt.publish
    data:
      topic: !input custom_app_topic
      retain: true
      payload: >-
        {% set today = now().date() %}
        {% set start = today.replace(month=1, day=1) %}
        {% set end = today.replace(year=today.year + 1, month=1, day=1) %}
        {% set total = (end - start).days %}
        {% set done = ((today - start).days + 1) %}
        {% set pct = (done / total * 100) | round(0) | int %}
        {% set cell = [done - 1, 363] | min %}
        {% set week = (cell // 7) %}
        {% set dayrow = (cell %% 7) %}
        {
          "duration": {{ display_duration | int }},
          "text": [],
          "image": [{"data": "", "position": [0, 0]}],
          "draw": [
            {"df": [0, 9, {{ week }}, 9 + {{ dayrow }}, "#003E1A"]},
            {"df": [{{ week }}, 9 + {{ dayrow }}, {{ week }}, 9 + {{ dayrow }}, "#00D678"]}
          ]
        }
