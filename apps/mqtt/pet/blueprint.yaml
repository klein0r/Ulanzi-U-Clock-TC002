# TC002 Desktop Pixel Pet (grey cat)
# Publishes a TC002 Custom App JSON payload over MQTT, switching the pet's action according to a Home Assistant entity's state.
# Assets: Shepardskin "Cat Sprites" (CC0, https://opengameart.org/content/cat-sprites),
#       recolored to a light grey tabby; CC0 is compatible with this repository's GPL-3.0.

blueprint:
  name: TC002 Desktop Pixel Pet
  description: |
    Turns the Ulanzi U-Clock TC002 into a desktop pixel pet (a grey cat).

    It watches a Home Assistant entity and switches the pet's action according to its state:
    idle: standing (slight breathing)  walk: walking  run: running
    For example, hook it up to a 'home/active/busy' style state, or any input_select.

    Assets by Shepardskin (CC0), recolored. Author: 小熊猫  License: GPL-3.0-or-later
  domain: automation
  source_url: https://github.com/UlanziTechnology/Ulanzi-U-Clock-TC002/blob/main/apps/mqtt/pet/blueprint.yaml
  input:
    status_entity:
      name: State entity
      description: The HA entity that provides the current state (for example input_select).
      selector:
        entity: {}
    custom_app_topic:
      name: TC002 Custom App MQTT topic
      description: Usually [PREFIX]/custom/[APP_NAME], for example ulanzi_1bf6/custom/pet.
      default: ulanzi_1bf6/custom/pet
      selector:
        text: {}
    app_duration:
      name: Display duration
      description: The duration written into the payload (seconds).
      default: 3600
      selector:
        number: { min: 1, max: 86400, unit_of_measurement: s, mode: box }
    retain_message:
      name: Retain MQTT message
      default: true
      selector:
        boolean: {}
    idle_state:
      name: idle state value
      default: "idle"
      selector: { text: {} }
    walk_state:
      name: walk state value
      default: "walk"
      selector: { text: {} }
    run_state:
      name: run state value
      default: "run"
      selector: { text: {} }

mode: restart

trigger:
  - platform: state
    entity_id: !input status_entity

variables:
  status_entity_id: !input status_entity
  duration: !input app_duration
  idle_value: !input idle_state
  walk_value: !input walk_state
  run_value: !input run_state
  current_status: "{{ states(status_entity_id) | lower }}"
  idle_image: "data:image/gif;base64,"
  walk_image: "data:image/gif;base64,"
  run_image: "data:image/gif;base64,"

action:
  - service: mqtt.publish
    data:
      topic: !input custom_app_topic
      retain: !input retain_message
      payload: >-
        {% set image = idle_image %}
        {% if current_status == walk_value | lower %}
          {% set image = walk_image %}
        {% elif current_status == run_value | lower %}
          {% set image = run_image %}
        {% endif %}
        {
          "duration": {{ duration | int }},
          "text": [],
          "image": [{"data": "{{ image }}", "position": [0, 0]}],
          "draw": []
        }
