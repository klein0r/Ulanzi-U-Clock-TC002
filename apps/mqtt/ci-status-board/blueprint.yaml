# TC002 CI Status Board
# Shows the GitHub Actions CI status on the TC002.

blueprint:
  name: TC002 CI Status Board
  description: |
    Shows the GitHub Actions CI status on the TC002.
    Green = passing, yellow = running, red = failing.

    Author: 王行知
    License: GPL-3.0-or-later
  domain: automation
  source_url: https://github.com/klein0r/Ulanzi-U-Clock-TC002/blob/docs/translate-to-english/apps/mqtt/ci-status-board/blueprint.yaml
  input:
    custom_app_topic:
      name: TC002 Custom App MQTT topic
      description: "Format: [PREFIX]/custom/[APP_NAME]"
      default: ulanzi_1bf6/custom/ci_status
      selector:
        text: {}
    github_repo:
      name: GitHub repository
      description: The repository to monitor, in the form owner/repo
      default: UlanziTechnology/Ulanzi-U-Clock-TC002
      selector:
        text: {}
    github_token:
      name: GitHub token (optional)
      description: Required for private repositories
      default: ""
      selector:
        text: {}
    display_duration:
      name: Display duration
      description: The payload duration value, in seconds.
      default: 31536000
      selector:
        number:
          min: 1
          max: 31536000
          unit_of_measurement: s
          mode: box

mode: restart

trigger:
  - platform: time
    minutes: "/5"
    seconds: 0

action:
  - service: mqtt.publish
    data:
      topic: !input custom_app_topic
      retain: true
      payload: >-
        {"duration": {{ display_duration | int }}, "text": [], "image": [{"data": "", "position": [0, 0]}], "draw": []}
