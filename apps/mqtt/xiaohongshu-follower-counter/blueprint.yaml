blueprint:
  name: TC002 Xiaohongshu Follower Count (Chrome + Home Assistant)
  description: >-
    Receives the 52×16 follower count image that the Chrome extension reads and renders from a Xiaohongshu profile,
    validates it against the TC002 device prefix allowlist, and publishes it through the Home Assistant MQTT integration.
  domain: automation
  source_url: https://github.com/klein0r/Ulanzi-U-Clock-TC002/blob/docs/translate-to-english/apps/mqtt/xiaohongshu-follower-counter/blueprint.yaml
  input:
    webhook_id:
      name: Webhook ID
      description: Use 24-128 random letters, digits, underscores or hyphens, and enter the same value in the Chrome extension.
      selector:
        text: {}
    allowed_device_prefixes:
      name: Allowed TC002 device prefixes
      description: One per line, for example ulanzi_1be3. The latest result on the extension's options page shows the dynamically discovered prefix.
      selector:
        text:
          multiline: true
    app_name:
      name: Custom App name
      description: The app name after custom/ in the MQTT topic; all devices share this name.
      default: xiaohongshu_followers
      selector:
        text: {}

variables:
  allowed_prefixes_text: !input allowed_device_prefixes
  app_name: !input app_name

trigger:
  - platform: webhook
    webhook_id: !input webhook_id
    allowed_methods: [POST]
    local_only: true

condition:
  - condition: template
    value_template: >-
      {% set allowed = allowed_prefixes_text.splitlines()
        | map('trim') | reject('equalto', '') | list %}
      {{ trigger.json is mapping
        and trigger.json.devicePrefix is string
        and trigger.json.devicePrefix in allowed
        and trigger.json.payload is string
        and trigger.json.payload | length <= 200000
        and app_name | length >= 1
        and app_name | length <= 64 }}
  - condition: template
    value_template: >-
      {% set valid_chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_-' %}
      {% set ns = namespace(valid=true) %}
      {% for character in app_name %}
        {% if character not in valid_chars %}
          {% set ns.valid = false %}
        {% endif %}
      {% endfor %}
      {{ ns.valid }}

action:
  - service: mqtt.publish
    data:
      topic: "{{ trigger.json.devicePrefix }}/custom/{{ app_name }}"
      payload: "{{ trigger.json.payload }}"
      qos: 0
      retain: true

mode: queued
max: 20
